name: School Sync

on:
  schedule:
    # Every 5 minutes — GitHub's minimum interval. This is the dominant
    # latency for "new assignment added" notifications when the Mac is
    # closed, so it's worth running at the floor.
    #
    # Offset to 2,7,12,... rather than 0,5,10,... on purpose: GitHub
    # delays scheduled workflows under load, and the top of the hour is
    # the worst moment to ask for a runner. Expect 5-15 minutes in
    # practice — scheduled runs are best-effort, not guaranteed on time.
    #
    # The repo must be PUBLIC for this to run on unlimited free minutes.
    # Secrets stay encrypted either way, but everything NOT in
    # .gitignore is world-readable — check `git status` before pushing.
    - cron: "2-59/5 * * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  # Tests are pure logic with no secrets, so they run on every push and
  # PR as well as on the schedule — and they gate the sync below, so a
  # cadence bug can't reach Peter's phone from a scheduled run.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The test cases themselves use only the standard library, but they
      # import the real modules under test — and notion_client imports
      # requests. Without this the whole discovery pass dies on
      # ModuleNotFoundError before a single test runs. Installing here
      # also proves requirements.txt is actually installable.
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  sync:
    needs: test
    # Don't touch live Notion data from a pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Never let two cloud syncs run at once. Once an external scheduler
    # is dispatching this workflow (see README "Beating GitHub's
    # scheduler"), a dispatched run and a leftover scheduled run can
    # land on top of each other. Both would read the same Last Reminded
    # and both would send -- reminders.due_for_reminder's lag separates
    # the cloud from the Mac, but nothing separates the cloud from
    # itself, and pipeline._should_send's recheck narrows that window
    # without closing it.
    #
    # cancel-in-progress is false on purpose: cancelling mid-run could
    # kill the process between a successful ntfy push and the Last
    # Reminded write, which would re-send that reminder on the next
    # pass. Queueing is the safe direction -- runs are ~1 minute and
    # dispatches are 5 minutes apart, so a queue never builds.
    concurrency:
      group: school-sync-cloud
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cloud sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCHOOL_EMAIL_HINTS: ${{ secrets.SCHOOL_EMAIL_HINTS }}
          # Required now that cloud_sync fires reminders too. Without
          # NTFY_TOPIC the run fails fast rather than syncing silently
          # with notifications disabled.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          # Optional -- powers the "Mark done" notification button. A
          # SECOND, different topic from NTFY_TOPIC. If unset here, the
          # button is simply absent from every notification; nothing
          # else breaks. See README "Mark done".
          NTFY_COMMAND_TOPIC: ${{ secrets.NTFY_COMMAND_TOPIC }}
          # Reminder behavior must match the Mac exactly, or the two
          # schedulers disagree about when it's night. SCHOOL_TIMEZONE
          # is the important one: these runners are UTC.
          SCHOOL_TIMEZONE: ${{ vars.SCHOOL_TIMEZONE || 'America/Denver' }}
          GOOGLE_CALENDAR_TIMEZONE: ${{ vars.GOOGLE_CALENDAR_TIMEZONE || 'America/Denver' }}
          QUIET_HOURS_START: ${{ vars.QUIET_HOURS_START || '00:00' }}
          QUIET_HOURS_END: ${{ vars.QUIET_HOURS_END || '05:00' }}
          # Continuous reminder-cadence formula (replaced the old fixed
          # tiers 2026-07-29) -- see shared/reminders.py and
          # .env.example for the full explanation of each constant.
          ASSIGNMENT_ALPHA_HOURS_PER_DAY: ${{ vars.ASSIGNMENT_ALPHA_HOURS_PER_DAY || '3.4' }}
          ASSIGNMENT_FLOOR_HOURS: ${{ vars.ASSIGNMENT_FLOOR_HOURS || '2.0' }}
          ASSIGNMENT_CEILING_HOURS: ${{ vars.ASSIGNMENT_CEILING_HOURS || '48.0' }}
          TASK_ALPHA_HOURS_PER_DAY: ${{ vars.TASK_ALPHA_HOURS_PER_DAY || '24.0' }}
          TASK_FLOOR_HOURS: ${{ vars.TASK_FLOOR_HOURS || '1.0' }}
          TASK_CEILING_HOURS: ${{ vars.TASK_CEILING_HOURS || '72.0' }}
          PRIORITY_MULTIPLIER_HIGH: ${{ vars.PRIORITY_MULTIPLIER_HIGH || '0.5' }}
          PRIORITY_MULTIPLIER_MEDIUM: ${{ vars.PRIORITY_MULTIPLIER_MEDIUM || '1.0' }}
          PRIORITY_MULTIPLIER_LOW: ${{ vars.PRIORITY_MULTIPLIER_LOW || '2.0' }}
          REMINDER_JITTER_FRACTION: ${{ vars.REMINDER_JITTER_FRACTION || '0.25' }}
          MAX_NOTIFICATIONS_PER_PASS: ${{ vars.MAX_NOTIFICATIONS_PER_PASS || '3' }}
          EVENT_REMINDER_HOUR: ${{ vars.EVENT_REMINDER_HOUR || '07:00' }}
          CLOUD_REMINDERS: ${{ vars.CLOUD_REMINDERS || 'true' }}
          CLOUD_REMINDER_LAG_MINUTES: ${{ vars.CLOUD_REMINDER_LAG_MINUTES || '5' }}
          CLASSROOM_LOOKBACK_HOURS: ${{ vars.CLASSROOM_LOOKBACK_HOURS || '48' }}
        run: python cloud_sync.py
